          type: integer
          description: Round at which the block payload was proposed
          format: int32
        blockRound:
          type: integer
          description: Round at which the block was produced
          format: int32
        attestationPower:
          type: integer
          description: Recorder attestation power
          format: int64
        attestationCommittee:
          type: integer
          description: Total attestation committee power
          format: int64
        deposit:
          type: integer
          description: Security deposit frozen on the baker's account for producing the block (micro tez)
          format: int64
        rewardDelegated:
          type: integer
          description: 'Portion of fixed reward, corresponding to delegated stake, paid to payload proposer''s liquid balance (micro tez)

            (it is not frozen and can be spent immediately).'
          format: int64
        rewardStakedOwn:
          type: integer
          description: 'Portion of fixed reward, corresponding to baker''s own stake, paid to payload proposer''s own staked balance (micro tez)

            (it is frozen and belongs to the baker).'
          format: int64
        rewardStakedEdge:
          type: integer
          description: 'Portion of fixed reward, corresponding to baker''s edge from external stake, paid to payload proposer''s own staked balance (micro tez)

            (it is frozen and belongs to the baker).'
          format: int64
        rewardStakedShared:
          type: integer
          description: 'Portion of fixed reward, corresponding to baker''s external stake, paid to payload proposer''s external staked balance (micro tez)

            (it is frozen and belongs to baker''s stakers).'
          format: int64
        bonusDelegated:
          type: integer
          description: 'Portion of bonus reward, corresponding to delegated stake, paid to block producer''s liquid balance (micro tez)

            (it is not frozen and can be spent immediately).'
          format: int64
        bonusStakedOwn:
          type: integer
          description: 'Portion of bonus reward, corresponding to baker''s own stake, paid to block producer''s own staked balance (micro tez)

            (it is frozen and belongs to the baker).'
          format: int64
        bonusStakedEdge:
          type: integer
          description: 'Portion of bonus reward, corresponding to baker''s edge from external stake, paid to block producer''s own staked balance (micro tez)

            (it is frozen and belongs to the baker).'
          format: int64
        bonusStakedShared:
          type: integer
          description: 'Portion of fixed reward, corresponding to baker''s external stake, paid to block producer''s external staked balance (micro tez)

            (it is frozen and belongs to baker''s stakers).'
          format: int64
        fees:
          type: integer
          description: Total fee gathered from operations, included into the block
          format: int64
        nonceRevealed:
          type: boolean
          description: 'Status of the seed nonce revelation

            `true` - seed nonce revealed

            `false` - there''s no `seed_nonce_hash` in the block or seed nonce revelation has missed'
        proposer:
          description: Baker who proposed the block payload
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Alias'
        producer:
          description: Baker who produced the block
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Alias'
