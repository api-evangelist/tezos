          type: boolean
          description: Liquidity baking toggle (`true` if enabled, `false` if disabled, or `null` if the baker says 'pass')
          nullable: true
        lbToggleEma:
          type: integer
          description: Liquidity baking escape EMA value with precision of 1000000 for integer computation
          format: int32
        attestations:
          type: array
          description: 'List of attestation (is operation, which specifies the head of the chain as seen by the attester of a given slot)

            operations, included in the block'
          nullable: true
          items:
            $ref: '#/components/schemas/AttestationOperation'
        preattestations:
          type: array
          description: List of preattestation operations, included in the block
          nullable: true
          items:
            $ref: '#/components/schemas/PreattestationOperation'
        proposals:
          type: array
          description: 'List of proposal (is used by bakers (delegates) to submit and/or upvote proposals to amend the protocol)

            operations, included in the block'
          nullable: true
          items:
            $ref: '#/components/schemas/ProposalOperation'
        ballots:
