          type: integer
          description: Height of the block from the genesis
          format: int32
        hash:
          type: string
          description: Block hash
        timestamp:
          type: string
          description: Datetime at which the block is claimed to have been created (ISO 8601, e.g. `2020-02-20T02:40:57Z`)
          format: date-time
