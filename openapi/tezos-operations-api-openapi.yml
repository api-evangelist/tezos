tags:
- name: Operations
paths:
  /v1/operations/{hash}:
    get:
      tags:
      - Operations
      summary: Get operations by hash
      description: "Returns a list of operations with the specified hash.  \n**NOTE: if you know in advance what operation type you want to get (e.g. transactions), prefer using `/v1/operations/{type}/{hash}`\n(e.g. [/v1/operations/transactions/{hash}](#operation/Operations_GetTransactionByHash)) instead, because it's much more efficient.**"
      operationId: Operations_GetByHash
      parameters:
      - name: hash
        in: path
        required: true
        description: Operation hash
        schema:
          type: string
        x-position: 1
      - name: micheline
        in: query
        description: 'Format of the parameters, storage and diffs: `0` - JSON, `1` - JSON string, `2` - raw micheline, `3` - raw micheline string'
        schema:
          default: Json
          oneOf:
          - $ref: '#/components/schemas/MichelineFormat'
        x-position: 2
      - name: quote
        in: query
        description: Comma-separated list of ticker symbols to inject historical prices into response
        schema:
          default: None
          oneOf:
          - $ref: '#/components/schemas/Symbols'
        x-position: 3
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operation'
  /v1/operations/{hash}/{counter}:
    get:
      tags:
      - Operations
      summary: Get operations by hash and counter
      description: "Returns a list of operations with the specified hash and counter.  \n**NOTE: if you know in advance what operation type you want to get (e.g. transactions), prefer using `/v1/operations/{type}/{hash}/{counter}`\n(e.g. [/v1/operations/transactions/{hash}/{counter}](#operation/Operations_GetTransactionByHashCounter)) instead, because it's much more efficient.**"
      operationId: Operations_GetByHashCounter
      parameters:
      - name: hash
        in: path
        required: true
        description: Operation hash
        schema:
          type: string
        x-position: 1
      - name: counter
        in: path
        required: true
        description: Operation counter
        schema:
          type: integer
          format: int32
        x-position: 2
      - name: micheline
        in: query
        description: 'Format of the parameters, storage and diffs: `0` - JSON, `1` - JSON string, `2` - raw micheline, `3` - raw micheline string'
        schema:
          default: Json
          oneOf:
          - $ref: '#/components/schemas/MichelineFormat'
        x-position: 3
      - name: quote
        in: query
        description: Comma-separated list of ticker symbols to inject historical prices into response
        schema:
          default: None
          oneOf:
          - $ref: '#/components/schemas/Symbols'
        x-position: 4
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operation'
  /v1/operations/{hash}/{counter}/{nonce}:
    get:
      tags:
      - Operations
      summary: Get operations by hash, counter and nonce
      description: "Returns an internal operations with the specified hash, counter and nonce.  \n**NOTE: if you know in advance what operation type you want to get (e.g. transactions), prefer using `/v1/operations/{type}/{hash}/{counter}/{nonce}`\n(e.g. [/v1/operations/transactions/{hash}/{counter}/{nonce}](#operation/Operations_GetTransactionByHashCounterNonce)) instead, because it's much more efficient.**"
      operationId: Operations_GetByHashCounterNonce
      parameters:
      - name: hash
        in: path
        required: true
        description: Operation hash
        schema:
          type: string
        x-position: 1
      - name: counter
        in: path
        required: true
        description: Operation counter
        schema:
          type: integer
          format: int32
        x-position: 2
      - name: nonce
        in: path
        required: true
        description: Operation nonce (internal)
        schema:
          type: integer
          format: int32
        x-position: 3
      - name: micheline
        in: query
        description: 'Format of the parameters, storage and diffs: `0` - JSON, `1` - JSON string, `2` - raw micheline, `3` - raw micheline string'
        schema:
          default: Json
          oneOf:
          - $ref: '#/components/schemas/MichelineFormat'
        x-position: 4
      - name: quote
        in: query
        description: Comma-separated list of ticker symbols to inject historical prices into response
        schema:
          default: None
          oneOf:
          - $ref: '#/components/schemas/Symbols'
        x-position: 5
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operation'
  /v1/operations/{hash}/status:
    get:
      tags:
      - Operations
      summary: Get operation status
      description: "Returns operation status: `true` if applied, `false` if failed, `null` (or HTTP 204) if doesn't exist.  \n**NOTE: if you know in advance what operation type you want to check (e.g. transactions), prefer using `/v1/operations/{type}/{hash}/status`\n(e.g. [/v1/operations/transactions/{hash}/status](#operation/Operations_GetTransactionStatus)) instead, because it's much more efficient.**"
      operationId: Operations_GetStatus
      parameters:
      - name: hash
        in: path
        required: true
        description: Operation hash
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: boolean
                nullable: true
  /v1/operations/attestations:
    get:
      tags:
      - Operations
      summary: Get attestations
      description: Returns a list of attestation operations.
      operationId: Operations_GetAttestations
      parameters:
      - name: delegate
        in: query
        description: 'Filters attestations by delegate. Allowed fields for `.eqx` mode: none.'
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AccountParameter'
        x-position: 1
        x-tzkt-extension: query-parameter
      - name: id
        in: query
        description: Filters operations by internal TzKT id.
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Int64Parameter'
        x-position: 2
        x-tzkt-extension: query-parameter
      - name: level
        in: query
        description: Filters attestations by level.
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 3
        x-tzkt-extension: query-parameter
      - name: timestamp
        in: query
        description: Filters attestations by timestamp.
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TimestampParameter'
        x-position: 4
        x-tzkt-extension: query-parameter
      - name: select
        in: query
        description: Specify comma-separated list of fields to include into response or leave it undefined to return full object. If you select single field, response will be an array of values in both `.fields` and `.values` modes.
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SelectParameter'
        x-position: 5
        x-tzkt-extension: query-parameter
      - name: sort
        in: query
        description: 'Sorts attestations by specified field. Supported fields: `id` (default), `level`.'
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/SortParameter'
        x-position: 6
        x-tzkt-extension: query-parameter
      - name: offset
        in: query
        description: Specifies which or how many items should be skipped
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OffsetParameter'
        x-position: 7
        x-tzkt-extension: query-parameter
      - name: limit
        in: query
        description: Maximum number of items to return
        schema:
          type: integer
          format: int32
          default: 100
          maximum: 10000.0
          minimum: 0.0
        x-position: 8
      - name: quote
        in: query
        description: Comma-separated list of ticker symbols to inject historical prices into response
        schema:
          default: None
          oneOf:
          - $ref: '#/components/schemas/Symbols'
        x-position: 9
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttestationOperation'
  /v1/operations/attestations/{hash}:
    get:
      tags:
      - Operations
      summary: Get attestation by hash
      description: Returns an attestation operation with specified hash.
      operationId: Operations_GetAttestationByHash
