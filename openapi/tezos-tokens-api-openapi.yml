openapi: 3.2.0
info:
  title: TzKT Tokens API
  description: '# Introduction


    TzKT is the most widely used tool in Tezos that provides you with convenient and flexible access to the Tezos blockchain data, processed and indexed by its own indexer.'
  contact:
    name: Baking Bad Team
    url: https://bakingbad.dev
    email: hello@bakingbad.dev
  version: 1.17.1
  x-logo:
    url: https://tzkt.io/logo.png
    href: https://tzkt.io/
servers:
- url: https://api.tzkt.io
tags:
- name: Tokens
paths:
  /v1/tokens/count:
    get:
      tags:
      - Tokens
      summary: Get tokens count
      description: Returns a total number of tokens.
      operationId: Tokens_GetTokensCount
      parameters:
      - name: id
        in: query
        description: "Filter by internal TzKT id. Note, this is not the same as `tokenId` nat value.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/Int64Parameter'
        x-position: 1
        x-tzkt-extension: query-parameter
      - name: contract
        in: query
        description: "Filter by contract address.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/AccountParameter'
        x-position: 2
        x-tzkt-extension: query-parameter
      - name: tokenId
        in: query
        description: "Filter by tokenId (for FA1.2 tokens tokenId is always `\"0\"`).  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/NatParameter'
        x-position: 3
        x-tzkt-extension: query-parameter
      - name: globalId
        in: query
        description: "Filter by \"global id\", which is a `\"{contract}:{tokenId}\"` string.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/TokenGlobalIdParameter'
        x-position: 4
      - name: standard
        in: query
        description: "Filter by token standard (`fa1.2` or `fa2`).  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/TokenStandardParameter'
        x-position: 5
        x-tzkt-extension: query-parameter
        x-tzkt-query-parameter: fa1.2,fa2
      - name: totalMinted
        in: query
        description: "Filter by total minted.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/NatParameter'
        x-position: 6
        x-tzkt-extension: query-parameter
      - name: totalBurned
        in: query
        description: "Filter by total burned. Note: total burned shows only those tokens that were literally burned,\nexcluding tokens sent to burn addresses (because they still exist on the burn address' balance).  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/NatParameter'
        x-position: 7
        x-tzkt-extension: query-parameter
      - name: totalSupply
        in: query
        description: "Filter by total supply. Note: total supply shows all existing tokens,\nincluding tokens sent to burn addresses (so that they exist on the burn address' balance).  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/NatParameter'
        x-position: 8
        x-tzkt-extension: query-parameter
      - name: firstMinter
        in: query
        description: "Filter by address of the first minter.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/AccountParameter'
        x-position: 9
        x-tzkt-extension: query-parameter
      - name: firstLevel
        in: query
        description: "Filter by level of the block where the token was first seen.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 10
        x-tzkt-extension: query-parameter
      - name: firstTime
        in: query
        description: "Filter by timestamp (ISO 8601) of the block where the token was first seen.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/TimestampParameter'
        x-position: 11
        x-tzkt-extension: query-parameter
      - name: lastLevel
        in: query
        description: "Filter by level of the block where the token was last seen.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 12
        x-tzkt-extension: query-parameter
      - name: lastTime
        in: query
        description: "Filter by timestamp (ISO 8601) of the block where the token was last seen.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/TimestampParameter'
        x-position: 13
        x-tzkt-extension: query-parameter
      - name: metadata
        in: query
        description: "Filter by metadata.  \nNote, this parameter supports the following format: `metadata{.path?}{.mode?}=...`,\nso you can specify a path to a particular field to filter by (for example, `?metadata.symbol.in=kUSD,uUSD`).  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/JsonParameter'
        x-position: 14
        x-tzkt-extension: json-parameter
      - name: indexedAt
        in: query
        schema:
          oneOf:
          - $ref: '#/components/schemas/Int32NullParameter'
        x-position: 15
        x-tzkt-extension: query-parameter
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: integer
                format: int32
