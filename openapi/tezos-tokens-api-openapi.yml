        schema:
          oneOf:
          - $ref: '#/components/schemas/NatParameter'
        x-position: 6
        x-tzkt-extension: query-parameter
      - name: token.standard
        in: query
        description: "Filter by token standard (`fa1.2` or `fa2`).  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/TokenStandardParameter'
        x-position: 7
        x-tzkt-extension: query-parameter
