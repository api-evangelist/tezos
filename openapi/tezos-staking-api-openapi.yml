        x-position: 10
        x-tzkt-extension: query-parameter
      - name: autostakingOpId
        in: query
        description: "Filter by the ID of the related operation.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/Int64NullParameter'
        x-position: 11
        x-tzkt-extension: query-parameter
      - name: stakingOpId
