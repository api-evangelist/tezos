          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 1
        x-tzkt-extension: query-parameter
      - name: level
        in: query
        description: "Filter by level of the block, where the staking update happened.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 2
        x-tzkt-extension: query-parameter
      - name: timestamp
        in: query
        description: "Filter by timestamp of the block, where the staking update happened.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/TimestampParameter'
        x-position: 3
        x-tzkt-extension: query-parameter
      - name: cycle
        in: query
        description: "Filter by freezer or block cycle (depending on the update type).  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 4
        x-tzkt-extension: query-parameter
      - name: baker
        in: query
        description: "Filter by related baker.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/AccountParameter'
        x-position: 5
        x-tzkt-extension: query-parameter
      - name: staker
        in: query
        description: "Filter by related staker.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/AccountParameter'
        x-position: 6
        x-tzkt-extension: query-parameter
      - name: type
        in: query
        description: "Filter by staking update type.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/StakingUpdateTypeParameter'
        x-position: 7
        x-tzkt-extension: query-parameter
        x-tzkt-query-parameter: stake,unstake,restake,finalize,slash_staked,slash_unstaked
      - name: amount
        in: query
        description: "Filter by amount.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/Int64Parameter'
        x-position: 8
        x-tzkt-extension: query-parameter
      - name: pseudotokens
        in: query
        description: "Filter by amount of staking pseudotokens minted or burnt.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/BigIntegerNullableParameter'
        x-position: 9
