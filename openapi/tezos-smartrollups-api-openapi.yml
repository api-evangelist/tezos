paths:
  /v1/smart_rollups/count:
    get:
      tags:
      - SmartRollups
      summary: Get smart rollups count
      description: Returns a total number of smart rollups.
      operationId: SmartRollups_GetSmartRollupsCount
      parameters:
      - name: id
        in: query
        description: "Filter by internal TzKT id.  \nClick on the parameter to expand more details."
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 1
        x-tzkt-extension: query-parameter
      - name: address
        in: query
        description: "Filter by smart rollup address.  \nClick on the parameter to expand more details."
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AddressParameter'
        x-position: 2
        x-tzkt-extension: query-parameter
      - name: creator
        in: query
        description: "Filter by smart rollup creator.  \nClick on the parameter to expand more details."
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/AccountParameter'
        x-position: 3
        x-tzkt-extension: query-parameter
      - name: firstActivity
        in: query
        description: "Filter by level of the block, where the rollup was first seen.  \nClick on the parameter to expand more details."
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 4
        x-tzkt-extension: query-parameter
      - name: firstActivityTime
        in: query
        description: "Filter by timestamp of the block, where the rollup was first seen.  \nClick on the parameter to expand more details."
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TimestampParameter'
        x-position: 5
        x-tzkt-extension: query-parameter
      - name: lastActivity
        in: query
        description: "Filter by level of the block, where the rollup was last seen.  \nClick on the parameter to expand more details."
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 6
        x-tzkt-extension: query-parameter
      - name: lastActivityTime
        in: query
        description: "Filter by timestamp of the block, where the rollup was last seen.  \nClick on the parameter to expand more details."
        schema:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TimestampParameter'
        x-position: 7
        x-tzkt-extension: query-parameter
