  /v1/smart_rollups/{address}:
    get:
      tags:
      - SmartRollups
      summary: Get smart rollup by address
      description: Returns a smart rollup with the specified address.
      operationId: SmartRollups_GetSmartRollup
      parameters:
      - name: address
        in: path
        required: true
        description: Smart rollup address
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
