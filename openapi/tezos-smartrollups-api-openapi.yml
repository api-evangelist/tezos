components:
  schemas:
    SortParameter:
      type: object
      additionalProperties: false
      properties:
        asc:
          type: string
          description: '**Ascending** sort mode (optional, i.e. `sort.asc=id` is the same as `sort=id`). \

            Specify a field name to sort by.


            Example: `?sort=balance`.'
          nullable: true
        desc:
          type: string
          description: '**Descending** sort mode. \

            Specify a field name to sort by descending.


            Example: `?sort.desc=id`.'
          nullable: true
      x-tzkt-extension: query-parameter
    OffsetParameter:
      type: object
      additionalProperties: false
      properties:
        el:
          type: integer
          description: '**Elements** offset mode (optional, i.e. `offset.el=123` is the same as `offset=123`). \

            Skips specified number of elements.


            Example: `?offset=100`.'
          format: int32
          nullable: true
        pg:
          type: integer
          description: '**Page** offset mode. \

            Skips `page * limit` elements. This is a classic pagination.


            Example: `?offset.pg=1`.'
          format: int32
          nullable: true
        cr:
          type: integer
          description: '**Cursor** offset mode. \

            Skips all elements with the `cursor` before (including) the specified value. Cursor is a field used for sorting, e.g. `id`.

            Avoid using this offset mode with non-unique or non-sequential cursors such as `amount`, `balance`, etc.


            Example: `?offset.cr=45837`.'
          format: int64
          nullable: true
      x-tzkt-extension: query-parameter
    IMicheline:
      type: object
      x-abstract: true
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/MichelineType'
    SrGame:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          description: "Internal TzKT id.  \n**[sortable]**"
          format: int64
        rollup:
          description: Smart rollup, in which's scope the refutation game was started.
          oneOf:
          - $ref: '#/components/schemas/Alias'
        initiator:
          description: Initiator, who found a wrong commitment and started the refutation game.
          oneOf:
          - $ref: '#/components/schemas/Alias'
        initiatorCommitment:
          description: Initiator's version of a valid commitment
          oneOf:
          - $ref: '#/components/schemas/SrCommitmentInfo'
        opponent:
          description: Opponent, who was accused in publishing a wrong commitment.
          oneOf:
          - $ref: '#/components/schemas/Alias'
        opponentCommitment:
          description: Opponent's version of a valid commitment
          oneOf:
          - $ref: '#/components/schemas/SrCommitmentInfo'
        lastMove:
          description: The most recent move (`sr_refute` operation).
          oneOf:
          - $ref: '#/components/schemas/SrGameMove'
        firstLevel:
          type: integer
          description: "Level of the block where the refutation game was started.  \n**[sortable]**"
          format: int32
        firstTime:
          type: string
          description: Timestamp of the block where the refutation game was started.
          format: date-time
        lastLevel:
          type: integer
          description: "Level of the block where the refutation game was last updated.  \n**[sortable]**"
          format: int32
        lastTime:
          type: string
          description: Timestamp of the block where the refutation game was last updated.
          format: date-time
        initiatorReward:
          type: integer
          description: In case the initiator won, this field will contain the reward amount (in mutez).
          format: int64
          nullable: true
        initiatorLoss:
          type: integer
          description: In case the initiator lost (including a `draw`), this field will contain the loss amount (in mutez).
          format: int64
          nullable: true
        opponentReward:
          type: integer
          description: In case the opponent won, this field will contain the reward amount (in mutez).
          format: int64
          nullable: true
        opponentLoss:
          type: integer
          description: In case the opponent lost (including a `draw`), this field will contain the loss amount (in mutez).
          format: int64
          nullable: true
    SrBondStatusParameter:
      type: object
      additionalProperties: false
      properties:
        eq:
          type: string
          description: '**Equal** filter mode (`.eq` suffix can be omitted, i.e. `?param=...` is the same as `?param.eq=...`). \

            Specify an sr bond status to get items where the specified field is equal to the specified value.


            Example: `?status=active`.'
          nullable: true
        ne:
          type: string
          description: '**Not equal** filter mode. \

            Specify an sr bond status to get items where the specified field is not equal to the specified value.


            Example: `?status.ne=active`.'
          nullable: true
        in:
          type: array
          description: '**In list** (any of) filter mode. \

            Specify a comma-separated list of sr bond statuses to get items where the specified field is equal to one of the specified values.


            Example: `?status.in=returned,lost`.'
          nullable: true
          items:
            type: string
        ni:
          type: array
          description: '**Not in list** (none of) filter mode. \

            Specify a comma-separated list of sr bond statuses to get items where the specified field is not equal to all the specified values.


            Example: `?status.ni=returned,lost`.'
          nullable: true
          items:
            type: string
      x-tzkt-extension: query-parameter
      x-tzkt-query-parameter: active,returned,lost
    MichelineFormat:
      type: string
      description: ''
      x-enumNames:
      - Json
      - JsonString
      - Raw
      - RawString
      enum:
      - Json
      - JsonString
      - Raw
      - RawString
    TimestampParameter:
      type: object
      additionalProperties: false
      properties:
        eq:
          type: string
          description: '**Equal** filter mode (optional, i.e. `param.eq=123` is the same as `param=123`). \

            Specify a datetime value to get items where the specified field is equal to the specified value.


            Example: `?timestamp=2020-02-20T02:40:57Z`.'
          format: date-time
          nullable: true
        ne:
          type: string
          description: '**Not equal** filter mode. \

            Specify a datetime value to get items where the specified field is not equal to the specified value.


            Example: `?timestamp.ne=2020-02-20T02:40:57Z`.'
          format: date-time
          nullable: true
        gt:
          type: string
          description: '**Greater than** filter mode. \

            Specify a datetime value to get items where the specified field is greater than the specified value.


            Example: `?timestamp.gt=2020-02-20T02:40:57Z`.'
          format: date-time
          nullable: true
        ge:
          type: string
          description: '**Greater or equal** filter mode. \

            Specify a datetime value to get items where the specified field is greater than equal to the specified value.


            Example: `?timestamp.ge=2020-02-20T02:40:57Z`.'
          format: date-time
          nullable: true
        lt:
          type: string
          description: '**Less than** filter mode. \

            Specify a datetime value to get items where the specified field is less than the specified value.


            Example: `?timestamp.lt=2020-02-20T02:40:57Z`.'
          format: date-time
          nullable: true
        le:
          type: string
          description: '**Less or equal** filter mode. \

            Specify a datetime value to get items where the specified field is less than or equal to the specified value.


            Example: `?timestamp.le=2020-02-20T02:40:57Z`.'
          format: date-time
          nullable: true
        in:
          type: array
          description: '**In list** (any of) filter mode. \

            Specify a comma-separated list of datetimes to get items where the specified field is equal to one of the specified values.


