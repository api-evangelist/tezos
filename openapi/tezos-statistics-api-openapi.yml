  /v1/statistics/current:
    get:
      tags:
      - Statistics
      summary: Get current statistics
      description: Returns statistics at the end of a head block.
      operationId: Statistics_GetCurrent
      parameters:
      - name: select
        in: query
        description: Specify comma-separated list of fields to include into response or leave it undefined to return full object. If you select a single field, response will be a single value in both `.fields` and `.values` modes.
        schema:
          oneOf:
          - $ref: '#/components/schemas/SelectParameter'
