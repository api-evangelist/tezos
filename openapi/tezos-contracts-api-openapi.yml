components:
  schemas:
    SortParameter:
      type: object
      additionalProperties: false
      properties:
        asc:
          type:
          - string
          - 'null'
          description: '**Ascending** sort mode (optional, i.e. `sort.asc=id` is the same as `sort=id`). \

            Specify a field name to sort by.


            Example: `?sort=balance`.'
        desc:
          type:
          - string
          - 'null'
          description: '**Descending** sort mode. \

            Specify a field name to sort by descending.


            Example: `?sort.desc=id`.'
      x-tzkt-extension: query-parameter
    Contract:
      allOf:
      - type: object
        additionalProperties: false
        properties:
          id:
            type: integer
            description: "Internal TzKT id.  \n**[sortable]**"
            format: int32
          type:
            type: string
            description: Type of the account, `contract` - smart contract programmable account.
          address:
            type: string
            description: Public key hash of the contract
          kind:
            type: string
            description: 'Kind of the contract (`delegator_contract` or `smart_contract`),

              where `delegator_contract` - manager.tz smart contract for delegation purpose only.'
          tzips:
            type:
            - array
            - 'null'
            description: List of implemented standards (TZIPs).
            items:
              type: string
          alias:
            type:
            - string
            - 'null'
            description: Name of the project behind the contract or contract description.
          balance:
            type: integer
            description: "Contract balance (micro tez).  \n**[sortable]**"
            format: int64
          creator:
            description: "Information about the account, which has deployed the contract to the blockchain.  \nClick on the field to expand more details."
            oneOf:
            - $ref: '#/components/schemas/Alias'
          delegate:
            description: "Information about the current delegate of the contract. `null` if it's not delegated.  \nClick on the field to expand more details."
            oneOf:
            - $ref: '#/components/schemas/DelegateInfo'
          delegationLevel:
            type:
            - integer
            - 'null'
            description: Block height of latest delegation. `null` if it's not delegated.
            format: int32
          delegationTime:
            type:
            - string
            - 'null'
            description: Block datetime of latest delegation (ISO 8601, e.g. `2020-02-20T02:40:57Z`). `null` if it's not delegated.
            format: date-time
          numContracts:
            type: integer
            description: Number of contracts, created (originated) and/or managed by the contract.
            format: int32
          tokensCount:
            type: integer
            description: Number of tokens minted in the contract.
            format: int32
          activeTokensCount:
            type: integer
            description: Number of account tokens with non-zero balances.
            format: int32
          tokenBalancesCount:
            type: integer
            description: Number of tokens the account ever had.
            format: int32
          tokenTransfersCount:
            type: integer
            description: Number of token transfers from/to the account.
            format: int32
          ticketsCount:
            type: integer
            description: Number of tickets minted in the contract.
            format: int32
          activeTicketsCount:
            type: integer
            description: Number of tickets the account owns.
            format: int32
          ticketBalancesCount:
            type: integer
            description: Number of tickets the account ever owned.
            format: int32
          ticketTransfersCount:
            type: integer
            description: Number of ticket transfers from/to the account.
            format: int32
          numDelegations:
            type: integer
            description: Number of delegation operations of the contract.
            format: int32
          numOriginations:
            type: integer
            description: Number of origination (deployment / contract creation) operations, related the contract.
            format: int32
          numTransactions:
            type: integer
            description: "Number of transaction (transfer) operations, related to the contract.  \n**[sortable]**"
            format: int32
          numReveals:
            type: integer
            description: Number of reveal (is used to reveal the public key associated with an account) operations of the contract.
            format: int32
          numMigrations:
            type: integer
            description: 'Number of migration (result of the context (database) migration during a protocol update) operations.

              related to the contract (synthetic type).'
            format: int32
          transferTicketCount:
            type: integer
            description: Number of transfer ticket operations related to the contract.
            format: int32
          increasePaidStorageCount:
            type: integer
