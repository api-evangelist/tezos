  /v1/contracts/{address}:
    get:
      tags:
      - Contracts
      summary: Get contract by address
      description: Returns a contract account with the specified address.
      operationId: Contracts_GetByAddress
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address (starting with KT)
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
  /v1/contracts/{address}/same:
    get:
      tags:
      - Contracts
      summary: Get same contracts
      description: 'Returns contracts which have the same script as the specified one.

        Note, contract scripts are compared by 32-bit hash, so in very rare cases there may be collisions.'
      operationId: Contracts_GetSame
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address (starting with KT)
        schema:
          type: string
        x-position: 1
      - name: sort
        in: query
        description: "Sorts items (asc or desc) by the specified field.\nYou can see what fields can be used for sorting in the response description, below.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/SortParameter'
        x-position: 2
        x-tzkt-extension: query-parameter
      - name: offset
        in: query
        description: "Specifies which or how many items should be skipped.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/OffsetParameter'
        x-position: 3
        x-tzkt-extension: query-parameter
      - name: limit
        in: query
        description: Maximum number of items to return.
        schema:
          type: integer
          format: int32
          maximum: 10000.0
          minimum: 0.0
        x-position: 4
      - name: select
        in: query
        description: "Specify a comma-separated list of fields to include into response or leave it undefined to get default set of fields.\nThis parameter accepts values of the following format: `{field}{path?}{as alias?}`, so you can do deep selection\n(for example, `?select=balance,token.metadata.symbol as token,...`).  \nNote, if you select just one field, the response will be flatten into a simple array of values.  \nClick on the parameter to expand the details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/SelectionParameter'
        x-position: 5
        x-tzkt-extension: query-parameter
      - name: includeStorage
        in: query
        description: Specifies whether to include contract storage value in response.
        schema:
          type: boolean
          default: false
        x-position: 6
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
  /v1/contracts/{address}/similar:
    get:
      tags:
      - Contracts
      summary: Get similar contracts
      description: 'Returns contracts which have the same interface (parameter and storage types) as the specified one.

        Note, contract parameter and storage types are compared by 32-bit hash, so in very rare cases there may be collisions.'
      operationId: Contracts_GetSimilar
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address (starting with KT)
        schema:
          type: string
        x-position: 1
      - name: sort
        in: query
        description: "Sorts items (asc or desc) by the specified field.\nYou can see what fields can be used for sorting in the response description, below.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/SortParameter'
        x-position: 2
        x-tzkt-extension: query-parameter
      - name: offset
        in: query
        description: "Specifies which or how many items should be skipped.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/OffsetParameter'
        x-position: 3
        x-tzkt-extension: query-parameter
      - name: limit
        in: query
        description: Maximum number of items to return.
        schema:
          type: integer
          format: int32
          maximum: 10000.0
          minimum: 0.0
        x-position: 4
      - name: select
        in: query
        description: "Specify a comma-separated list of fields to include into response or leave it undefined to get default set of fields.\nThis parameter accepts values of the following format: `{field}{path?}{as alias?}`, so you can do deep selection\n(for example, `?select=balance,token.metadata.symbol as token,...`).  \nNote, if you select just one field, the response will be flatten into a simple array of values.  \nClick on the parameter to expand the details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/SelectionParameter'
        x-position: 5
        x-tzkt-extension: query-parameter
      - name: includeStorage
        in: query
        description: Specifies whether to include contract storage value in response.
        schema:
          type: boolean
          default: false
        x-position: 6
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contract'
  /v1/contracts/{address}/code:
    get:
      tags:
      - Contracts
      summary: Get contract code
      description: Returns a code of the specified contract.
      operationId: Contracts_GetCode
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address (starting with KT)
        schema:
          type: string
        x-position: 1
      - name: level
        in: query
        description: Level at which contract code should be taken. If `0` or not specified, the current value will be returned.
        schema:
          type: integer
          format: int32
          default: 0
        x-position: 2
      - name: format
        in: query
        description: Code format (`0` - micheline, `1` - michelson, `2` - bytes (base64))
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2.0
          minimum: 0.0
        x-position: 3
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /v1/contracts/{address}/interface:
    get:
      tags:
      - Contracts
      summary: Get JSON Schema [2020-12] interface for the contract
      description: Returns standard JSON Schema for contract storage, entrypoints, and Big_map entries.
      operationId: Contracts_GetInterface
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address
        schema:
          type: string
        x-position: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractInterface'
  /v1/contracts/{address}/entrypoints:
    get:
      tags:
      - Contracts
      summary: Get contract entrypoints
      description: Returns entrypoints of the specified contract.
      operationId: Contracts_GetEntrypoints
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address (starting with KT)
        schema:
          type: string
        x-position: 1
      - name: all
        in: query
        description: "If true, returns all entrypoints, including unused ones.\n            Unused means that the entrypoint can be normalized to a more specific one.\n            For example here `(or %entry1 (unit %entry2) (nat %entry3))` the `%entry1` is unused entrypoint\n            because it can be normalized to `%entry2` or `%entry3`"
        schema:
          type: boolean
          default: false
        x-position: 2
      - name: json
        in: query
        description: Include parameters schema in human-readable JSON format
        schema:
          type: boolean
          default: true
        x-position: 3
      - name: micheline
        in: query
        description: Include parameters schema in micheline format
        schema:
          type: boolean
          default: false
        x-position: 4
      - name: michelson
        in: query
        description: Include parameters schema in michelson format
        schema:
          type: boolean
          default: false
        x-position: 5
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entrypoint'
  /v1/contracts/{address}/entrypoints/{name}:
    get:
      tags:
      - Contracts
      summary: Get entrypoint by name
      description: Returns contract's entrypoint with specified name.
      operationId: Contracts_GetEntrypointByName
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address (starting with KT)
        schema:
          type: string
        x-position: 1
      - name: name
        in: path
        required: true
        description: Entrypoint name
        schema:
          type: string
        x-position: 2
      - name: json
        in: query
        description: Include parameters schema in human-readable JSON format
        schema:
          type: boolean
          default: true
        x-position: 3
      - name: micheline
        in: query
        description: Include parameters schema in micheline format
        schema:
          type: boolean
          default: false
        x-position: 4
      - name: michelson
        in: query
        description: Include parameters schema in michelson format
        schema:
          type: boolean
          default: false
        x-position: 5
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrypoint'
  /v1/contracts/{address}/views:
    get:
      tags:
      - Contracts
      summary: Get contract views
      description: Returns all views of the specified contract.
      operationId: Contracts_GetContractViews
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address (starting with KT)
        schema:
          type: string
        x-position: 1
      - name: json
        in: query
        description: Include parameter and return types in human-readable JSON format
        schema:
          type: boolean
          default: true
        x-position: 2
      - name: micheline
        in: query
        description: Include parameter and return types in micheline format
        schema:
          type: boolean
          default: false
        x-position: 3
      - name: michelson
        in: query
        description: Include parameter and return types in michelson format
        schema:
          type: boolean
          default: false
        x-position: 4
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractView'
  /v1/contracts/{address}/views/{name}:
    get:
      tags:
      - Contracts
      summary: Get view by name
      description: Returns contract view with specified name.
      operationId: Contracts_GetContractViewByName
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address (starting with KT)
        schema:
          type: string
        x-position: 1
      - name: name
        in: path
        required: true
        description: View name
        schema:
          type: string
        x-position: 2
      - name: json
        in: query
        description: Include parameter and return types in human-readable JSON format
        schema:
          type: boolean
          default: true
        x-position: 3
      - name: micheline
        in: query
        description: Include parameter and return types in micheline format
        schema:
          type: boolean
          default: false
        x-position: 4
      - name: michelson
        in: query
        description: Include parameter and return types in michelson format
        schema:
          type: boolean
          default: false
        x-position: 5
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractView'
  /v1/contracts/{address}/entrypoints/{name}/build:
    get:
      tags:
      - Contracts
      summary: Build entrypoint parameters
      description: Returns micheline parameters converted from its JSON representation.
      operationId: Contracts_BuildEntrypointParametersGET
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address
        schema:
          type: string
        x-position: 1
      - name: name
        in: path
        required: true
        description: Entrypoint name
        schema:
          type: string
        x-position: 2
      - name: value
        in: query
        description: Json parameters
        schema:
          type: string
        x-position: 3
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    post:
      tags:
      - Contracts
      summary: Build entrypoint parameters
      description: Returns micheline parameters converted from its JSON representation.
      operationId: Contracts_BuildEntrypointParametersPOST
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address
        schema:
          type: string
        x-position: 1
      - name: name
        in: path
        required: true
        description: Entrypoint name
        schema:
          type: string
        x-position: 2
      requestBody:
        x-name: value
        description: Json parameters
        content:
          application/json:
            schema: {}
        required: true
        x-position: 3
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /v1/contracts/{address}/storage:
    get:
      tags:
      - Contracts
      summary: Get contract storage
      description: Returns contract storage value in JSON format.
      operationId: Contracts_GetStorage
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address
        schema:
          type: string
        x-position: 1
      - name: level
        in: query
        description: Level at which storage value should be taken. If `0` or not specified, the current value will be returned.
        schema:
          type: integer
          format: int32
          default: 0
        x-position: 2
