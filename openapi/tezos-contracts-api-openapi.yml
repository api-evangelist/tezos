        description: "Filter by number of different tickets minted within the contract.  \nClick on the parameter to expand more details."
        schema:
          oneOf:
          - $ref: '#/components/schemas/Int32Parameter'
        x-position: 15
        x-tzkt-extension: query-parameter
      responses:
