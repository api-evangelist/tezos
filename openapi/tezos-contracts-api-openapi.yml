  /v1/contracts/{address}/code:
    get:
      tags:
      - Contracts
      summary: Get contract code
      description: Returns a code of the specified contract.
      operationId: Contracts_GetCode
      parameters:
      - name: address
        in: path
        required: true
        description: Contract address (starting with KT)
        schema:
          type: string
        x-position: 1
      - name: level
        in: query
        description: Level at which contract code should be taken. If `0` or not specified, the current value will be returned.
        schema:
          type: integer
          format: int32
          default: 0
        x-position: 2
      - name: format
        in: query
        description: Code format (`0` - micheline, `1` - michelson, `2` - bytes (base64))
        schema:
          type: integer
          format: int32
          default: 0
          maximum: 2.0
          minimum: 0.0
        x-position: 3
      responses:
        '200':
          description: ''
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
